name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate release tag version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          expected="v$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF_NAME}" != "$expected" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ($expected)."
            exit 1
          fi

      - name: Run tests
        run: python -m pytest

  macos:
    name: macOS DMG
    runs-on: macos-14
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify macOS update signing key
        env:
          IZBUL_UPDATE_PRIVATE_KEY: ${{ secrets.IZBUL_UPDATE_PRIVATE_KEY }}
        run: |
          if [[ -z "$IZBUL_UPDATE_PRIVATE_KEY" ]]; then
            echo "Repository secret IZBUL_UPDATE_PRIVATE_KEY is required."
            exit 1
          fi

      - name: Build macOS installer
        env:
          IZBUL_UPDATE_PRIVATE_KEY: ${{ secrets.IZBUL_UPDATE_PRIVATE_KEY }}
        run: bash scripts/build_macos.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: Izbul-macOS
          path: release/macos/*

  windows:
    name: Windows Setup
    runs-on: windows-latest
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installers
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: Izbul-Windows
          path: release/windows/*

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs:
      - macos
      - windows
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: Izbul-macOS
          path: release-assets

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: Izbul-Windows
          path: release-assets

      - name: Create release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "İzbul $GITHUB_REF_NAME" \
              --generate-notes
          fi

          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
